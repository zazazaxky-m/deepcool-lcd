<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#40c4ff"/>
      <stop offset="1" stop-color="#76e06f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3140"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
  </defs>
  <!-- pump head -->
  <circle cx="64" cy="64" r="58" fill="url(#body)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#3a4356" stroke-width="2"/>
  <!-- LCD -->
  <rect x="22" y="32" width="84" height="64" rx="8" fill="#090b10"/>
  <!-- temperature gauge on the screen -->
  <path d="M 44 82 A 22 22 0 1 1 84 82" fill="none" stroke="#2b3242" stroke-width="7" stroke-linecap="round"/>
  <path d="M 44 82 A 22 22 0 0 1 75.5 46" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
  <rect x="55" y="62" width="18" height="10" rx="2" fill="#76e06f"/>
</svg>
